<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NBA Hub</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Auth screen ---------- */
  #auth-screen {
    width: 100%;
    max-width: 380px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    padding: 40px 32px;
  }
  #auth-screen h1 {
    text-align: center;
    color: #1a1a1a;
    margin-bottom: 8px;
    font-size: 24px;
  }
  #auth-screen .subtitle {
    text-align: center;
    color: #888;
    margin-bottom: 28px;
    font-size: 14px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-group input {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 0.15s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #1a73e8;
  }
  .btn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-primary {
    background: #1a73e8;
    color: #fff;
  }
  .btn-primary:hover { background: #1557b0; }
  .toggle-text {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #666;
  }
  .toggle-text a {
    color: #1a73e8;
    cursor: pointer;
    text-decoration: none;
    font-weight: 500;
  }
  .toggle-text a:hover { text-decoration: underline; }
  .error-msg {
    color: #d93025;
    font-size: 13px;
    margin-bottom: 12px;
    min-height: 18px;
  }
  .success-msg {
    color: #1e8e3e;
    font-size: 13px;
    margin-bottom: 12px;
    min-height: 18px;
  }

  /* ---------- Home (post-login) ---------- */
  #home-screen {
    width: 100%;
    min-height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    border-bottom: 1px solid #eee;
    background: #fff;
  }
  .topbar .brand {
    font-weight: 700;
    color: #1a73e8;
    font-size: 18px;
  }
  .topbar .user-area {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .topbar .welcome {
    font-size: 14px;
    color: #555;
  }
  .topbar .welcome b { color: #1a1a1a; }
  .logout-btn {
    padding: 7px 16px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    color: #555;
  }
  .logout-btn:hover { background: #f5f5f5; }
  .content {
    flex: 1;
    padding: 28px 32px 48px;
    color: #1a1a1a;
    font-size: 14px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  /* ---------- Stat leaders ---------- */
  .leaders-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .leader-card {
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    color: #fff;
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: 0 4px 14px rgba(26,115,232,0.25);
  }
  .leader-card .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.85;
    margin-bottom: 6px;
  }
  .leader-card .value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
  }
  .leader-card .who {
    font-size: 13px;
    margin-top: 6px;
    opacity: 0.95;
  }

  /* ---------- Controls ---------- */
  .content h2 {
    font-size: 20px;
    margin-bottom: 14px;
    color: #1a1a1a;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
    align-items: center;
  }
  .search-box {
    flex: 1;
    min-width: 220px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    padding: 11px 14px 11px 38px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  .search-box input:focus { outline: none; border-color: #1a73e8; }
  .search-box .icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: #999;
    font-size: 16px;
  }
  .select-wrap select {
    padding: 11px 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    cursor: pointer;
  }
  .select-wrap select:focus { outline: none; border-color: #1a73e8; }
  .results-count {
    font-size: 13px;
    color: #666;
    margin-bottom: 14px;
  }

  /* ---------- Player grid ---------- */
  .player-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .player-card {
    background: #fff;
    border: 1px solid #eee;
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  }
  .player-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
    border-color: #1a73e8;
  }
  .player-card .pc-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .player-card .pc-name {
    font-size: 16px;
    font-weight: 600;
    color: #1a1a1a;
    line-height: 1.3;
  }
  .player-card .pc-num {
    font-size: 12px;
    color: #888;
    margin-top: 2px;
  }
  .player-card .pc-team {
    background: #1a73e8;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 12px;
    white-space: nowrap;
  }
  .player-card .pc-pos {
    font-size: 11px;
    color: #666;
    background: #f0f4ff;
    padding: 3px 8px;
    border-radius: 10px;
    margin-top: 4px;
    display: inline-block;
  }
  .player-card .pc-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid #f0f0f0;
  }
  .player-card .stat {
    text-align: center;
  }
  .player-card .stat .sv {
    font-size: 16px;
    font-weight: 700;
    color: #1a1a1a;
  }
  .player-card .stat .sl {
    font-size: 10px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    margin-top: 2px;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.show {
    opacity: 1;
    pointer-events: auto;
  }
  .modal {
    background: #fff;
    border-radius: 14px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 0;
  }
  .modal-head {
    background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
    color: #fff;
    padding: 24px 28px;
    border-radius: 14px 14px 0 0;
    position: relative;
  }
  .modal-head .mh-name {
    font-size: 24px;
    font-weight: 700;
  }
  .modal-head .mh-team {
    font-size: 14px;
    opacity: 0.9;
    margin-top: 4px;
  }
  .modal-head .close-btn {
    position: absolute;
    top: 16px;
    right: 18px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: #fff;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    line-height: 1;
  }
  .modal-head .close-btn:hover { background: rgba(255,255,255,0.35); }
  .modal-body { padding: 24px 28px; }
  .modal-body .info-row {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .modal-body .info-item .il {
    font-size: 11px;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .modal-body .info-item .iv {
    font-size: 15px;
    color: #1a1a1a;
    font-weight: 500;
    margin-top: 2px;
  }
  .modal-body h4 {
    font-size: 14px;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .modal-body .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
  .modal-body .stat-box {
    background: #f7f9fc;
    border-radius: 8px;
    padding: 12px;
    text-align: center;
  }
  .modal-body .stat-box .sv {
    font-size: 20px;
    font-weight: 700;
    color: #1a73e8;
  }
  .modal-body .stat-box .sl {
    font-size: 11px;
    color: #888;
    margin-top: 3px;
  }

  @media (max-width: 720px) {
    .leaders-row { grid-template-columns: repeat(2, 1fr); }
    .modal-body .stat-grid { grid-template-columns: repeat(2, 1fr); }
    .topbar { padding: 14px 18px; }
    .content { padding: 20px 18px 40px; }
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="auth-screen">
  <h1 id="auth-title">Log In</h1>
  <p class="subtitle" id="auth-subtitle">Welcome back to NBA Hub</p>

  <div id="error-msg" class="error-msg"></div>
  <div id="success-msg" class="success-msg"></div>

  <!-- Login form -->
  <div id="login-form">
    <div class="form-group">
      <label for="login-username">Username</label>
      <input type="text" id="login-username" autocomplete="username" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="Enter password">
    </div>
    <button class="btn btn-primary" id="login-btn">Log In</button>
    <p class="toggle-text">Don't have an account? <a id="switch-to-register">Register</a></p>
  </div>

  <!-- Register form -->
  <div id="register-form" class="hidden">
    <div class="form-group">
      <label for="reg-username">Username</label>
      <input type="text" id="reg-username" autocomplete="username" placeholder="Choose a username">
    </div>
    <div class="form-group">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" autocomplete="new-password" placeholder="Choose a password">
    </div>
    <div class="form-group">
      <label for="reg-confirm">Confirm Password</label>
      <input type="password" id="reg-confirm" autocomplete="new-password" placeholder="Re-enter password">
    </div>
    <button class="btn btn-primary" id="register-btn">Register</button>
    <p class="toggle-text">Already have an account? <a id="switch-to-login">Log In</a></p>
  </div>
</div>

<!-- ============ HOME SCREEN ============ -->
<div id="home-screen" class="hidden">
  <div class="topbar">
    <div class="brand">NBA Hub</div>
    <div class="user-area">
      <span class="welcome">Hi, <b id="current-user"></b></span>
      <button class="logout-btn" id="logout-btn">Log Out</button>
    </div>
  </div>
  <div class="content">
    <!-- Stat leaders -->
    <h2>Stat Leaders</h2>
    <div class="leaders-row" id="leaders-row"></div>

    <!-- Players section -->
    <h2>NBA Players</h2>
    <div class="controls">
      <div class="search-box">
        <span class="icon">&#128269;</span>
        <input type="text" id="search-input" placeholder="Search by player or team name...">
      </div>
      <div class="select-wrap">
        <select id="team-filter">
          <option value="">All Teams</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="pos-filter">
          <option value="">All Positions</option>
          <option value="PG">PG</option>
          <option value="SG">SG</option>
          <option value="SF">SF</option>
          <option value="PF">PF</option>
          <option value="C">C</option>
        </select>
      </div>
      <div class="select-wrap">
        <select id="sort-by">
          <option value="name">Sort: Name (A-Z)</option>
          <option value="ppg">Sort: Points (PPG)</option>
          <option value="rpg">Sort: Rebounds (RPG)</option>
          <option value="apg">Sort: Assists (APG)</option>
          <option value="spg">Sort: Steals (SPG)</option>
          <option value="bpg">Sort: Blocks (BPG)</option>
          <option value="fg">Sort: FG %</option>
          <option value="tp">Sort: 3P %</option>
        </select>
      </div>
    </div>
    <div class="results-count" id="results-count"></div>
    <div class="player-grid" id="player-grid"></div>
  </div>
</div>

<!-- ============ PLAYER MODAL ============ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
(function () {
  "use strict";

  const USERS_KEY = "nba_hub_users";
  const SESSION_KEY = "nba_hub_session";

  // ---------- Simple hash (not cryptographically secure, but avoids plaintext) ----------
  function simpleHash(str) {
    let hash = 5381;
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) + hash) + str.charCodeAt(i);
      hash = hash & hash; // 32-bit
    }
    return String(hash);
  }

  function getUsers() {
    try {
      return JSON.parse(localStorage.getItem(USERS_KEY) || "{}");
    } catch (e) {
      return {};
    }
  }

  function saveUsers(users) {
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
  }

  // ---------- Element refs ----------
  const authScreen = document.getElementById("auth-screen");
  const homeScreen = document.getElementById("home-screen");
  const authTitle = document.getElementById("auth-title");
  const authSubtitle = document.getElementById("auth-subtitle");
  const loginForm = document.getElementById("login-form");
  const registerForm = document.getElementById("register-form");
  const errorMsg = document.getElementById("error-msg");
  const successMsg = document.getElementById("success-msg");

  const loginUsername = document.getElementById("login-username");
  const loginPassword = document.getElementById("login-password");
  const regUsername = document.getElementById("reg-username");
  const regPassword = document.getElementById("reg-password");
  const regConfirm = document.getElementById("reg-confirm");

  function clearMsgs() {
    errorMsg.textContent = "";
    successMsg.textContent = "";
  }

  function showError(msg) {
    clearMsgs();
    errorMsg.textContent = msg;
  }

  function showSuccess(msg) {
    clearMsgs();
    successMsg.textContent = msg;
  }

  // ---------- View switching ----------
  function showLogin() {
    authTitle.textContent = "Log In";
    authSubtitle.textContent = "Welcome back to NBA Hub";
    loginForm.classList.remove("hidden");
    registerForm.classList.add("hidden");
    clearMsgs();
  }

  function showRegister() {
    authTitle.textContent = "Register";
    authSubtitle.textContent = "Create your NBA Hub account";
    registerForm.classList.remove("hidden");
    loginForm.classList.add("hidden");
    clearMsgs();
  }

  function showHome(username) {
    authScreen.classList.add("hidden");
    homeScreen.classList.remove("hidden");
    document.getElementById("current-user").textContent = username;
    if (window.renderNBA) window.renderNBA();
  }

  function showAuth() {
    homeScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    showLogin();
    loginUsername.value = "";
    loginPassword.value = "";
    regUsername.value = "";
    regPassword.value = "";
    regConfirm.value = "";
  }

  // ---------- Register ----------
  document.getElementById("register-btn").addEventListener("click", function () {
    clearMsgs();
    const username = regUsername.value.trim();
    const password = regPassword.value;
    const confirm = regConfirm.value;

    if (!username) { showError("Please enter a username."); return; }
    if (username.length < 3) { showError("Username must be at least 3 characters."); return; }
    if (!password) { showError("Please enter a password."); return; }
    if (password.length < 6) { showError("Password must be at least 6 characters."); return; }
    if (password !== confirm) { showError("Passwords do not match."); return; }

    const users = getUsers();
    if (users[username]) {
      showError("Username already exists. Please choose another.");
      return;
    }

    users[username] = { passwordHash: simpleHash(password) };
    saveUsers(users);
    showSuccess("Account created! You can log in now.");

    // Pre-fill login username and switch to login
    loginUsername.value = username;
    regUsername.value = "";
    regPassword.value = "";
    regConfirm.value = "";
    setTimeout(showLogin, 800);
  });

  // ---------- Login ----------
  document.getElementById("login-btn").addEventListener("click", function () {
    clearMsgs();
    const username = loginUsername.value.trim();
    const password = loginPassword.value;

    if (!username) { showError("Please enter your username."); return; }
    if (!password) { showError("Please enter your password."); return; }

    const users = getUsers();
    if (!users[username]) {
      showError("User not found. Please register first.");
      return;
    }
    if (users[username].passwordHash !== simpleHash(password)) {
      showError("Incorrect password.");
      return;
    }

    // Success — set session
    localStorage.setItem(SESSION_KEY, username);
    loginUsername.value = "";
    loginPassword.value = "";
    showHome(username);
  });

  // ---------- Logout ----------
  document.getElementById("logout-btn").addEventListener("click", function () {
    localStorage.removeItem(SESSION_KEY);
    showAuth();
  });

  // ---------- Switch tabs ----------
  document.getElementById("switch-to-register").addEventListener("click", showRegister);
  document.getElementById("switch-to-login").addEventListener("click", showLogin);

  // ---------- Enter key submits ----------
  loginPassword.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("login-btn").click();
  });
  regConfirm.addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("register-btn").click();
  });

  // ---------- Auto-login if session exists ----------
  const sessionUser = localStorage.getItem(SESSION_KEY);
  if (sessionUser && getUsers()[sessionUser]) {
    showHome(sessionUser);
  } else {
    showAuth();
  }
})();
</script>

    { name: "Dillon Brooks", team: "HOU", teamName: "Rockets", pos: "SF", num: 9, height: "6'6\"", weight: 225, age: 28, exp: 8, college: "Oregon", ppg: 14.0, rpg: 3.7, apg: 1.7, spg: 0.8, bpg: 0.3, fg: 0.428, tp: 0.359, ft: 0.840, top: 1.4 },
    { name: "Devin Vassell", team: "SAS", teamName: "Spurs", pos: "SG", num: 24, height: "6'5\"", weight: 200, age: 24, exp: 5, college: "Florida State", ppg: 17.8, rpg: 4.0, apg: 3.5, spg: 1.2, bpg: 0.5, fg: 0.453, tp: 0.372, ft: 0.800, top: 1.7 },
    { name: "Chris Paul", team: "SAS", teamName: "Spurs", pos: "PG", num: 3, height: "6'0\"", weight: 175, age: 40, exp: 20, college: "Wake Forest", ppg: 9.2, rpg: 3.7, apg: 7.4, spg: 1.2, bpg: 0.1, fg: 0.457, tp: 0.376, ft: 0.930, top: 1.5 },
    { name: "Andrew Nembhard", team: "IND", teamName: "Pacers", pos: "PG", num: 2, height: "6'5\"", weight: 193, age: 25, exp: 3, college: "Gonzaga", ppg: 10.0, rpg: 3.0, apg: 5.5, spg: 1.1, bpg: 0.2, fg: 0.464, tp: 0.349, ft: 0.769, top: 1.4 }
  ];

  // ---------- Element refs ----------
  const grid = document.getElementById("player-grid");
  const leadersRow = document.getElementById("leaders-row");
  const searchInput = document.getElementById("search-input");
  const teamFilter = document.getElementById("team-filter");
  const posFilter = document.getElementById("pos-filter");
  const sortBy = document.getElementById("sort-by");
  const resultsCount = document.getElementById("results-count");
  const modalOverlay = document.getElementById("modal-overlay");
  const modal = document.getElementById("modal");

  let currentList = PLAYERS.slice();

  // ---------- Populate team filter ----------
  function populateTeamFilter() {
    const teams = {};
    PLAYERS.forEach(function (p) {
      if (!teams[p.team]) teams[p.team] = p.teamName;
    });
    const sorted = Object.keys(teams).sort(function (a, b) {
      return teams[a].localeCompare(teams[b]);
    });
    sorted.forEach(function (abbr) {
      const opt = document.createElement("option");
      opt.value = abbr;
      opt.textContent = teams[abbr] + " (" + abbr + ")";
      teamFilter.appendChild(opt);
    });
  }

  // ---------- Stat leaders ----------
  function renderLeaders() {
    const cats = [
      { key: "ppg", label: "Points Per Game", suffix: "" },
      { key: "rpg", label: "Rebounds Per Game", suffix: "" },
      { key: "apg", label: "Assists Per Game", suffix: "" },
      { key: "bpg", label: "Blocks Per Game", suffix: "" }
    ];
    leadersRow.innerHTML = "";
    cats.forEach(function (cat) {
      let best = PLAYERS[0];
      PLAYERS.forEach(function (p) {
        if (p[cat.key] > best[cat.key]) best = p;
      });
      const card = document.createElement("div");
      card.className = "leader-card";
      card.innerHTML =
        '<div class="label">' + cat.label + "</div>" +
        '<div class="value">' + best[cat.key].toFixed(1) + "</div>" +
        '<div class="who">' + best.name + " &middot; " + best.team + "</div>";
      leadersRow.appendChild(card);
    });
  }

  // ---------- Helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function pct(v) { return (v * 100).toFixed(1) + "%"; }

  // ---------- Render player cards ----------
  function render() {
    const q = searchInput.value.trim().toLowerCase();
    const tf = teamFilter.value;
    const pf = posFilter.value;
    const sb = sortBy.value;

    currentList = PLAYERS.filter(function (p) {
      if (tf && p.team !== tf) return false;
      if (pf && p.pos !== pf) return false;
      if (q) {
        const hay = (p.name + " " + p.team + " " + p.teamName).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });

    currentList.sort(function (a, b) {
      if (sb === "name") return a.name.localeCompare(b.name);
      return b[sb] - a[sb];
    });

    grid.innerHTML = "";
    if (currentList.length === 0) {
      grid.innerHTML = '<div class="empty-state">No players match your search.</div>';
      resultsCount.textContent = "0 players found";
      return;
    }

    resultsCount.textContent = currentList.length + " player" + (currentList.length === 1 ? "" : "s") + " found";

    currentList.forEach(function (p, idx) {
      const card = document.createElement("div");
      card.className = "player-card";
      card.innerHTML =
        '<div class="pc-head">' +
          '<div>' +
            '<div class="pc-name">' + esc(p.name) + "</div>" +
            '<div class="pc-num">#' + p.num + " &middot; " + p.pos + "</div>" +
          "</div>" +
          '<div class="pc-team">' + esc(p.team) + "</div>" +
        "</div>" +
        '<div class="pc-pos">' + esc(p.teamName) + "</div>" +
        '<div class="pc-stats">' +
          '<div class="stat"><div class="sv">' + p.ppg.toFixed(1) + '</div><div class="sl">PPG</div></div>' +
          '<div class="stat"><div class="sv">' + p.rpg.toFixed(1) + '</div><div class="sl">RPG</div></div>' +
          '<div class="stat"><div class="sv">' + p.apg.toFixed(1) + '</div><div class="sl">APG</div></div>' +
        "</div>";
      card.addEventListener("click", function () { openModal(p); });
      grid.appendChild(card);
    });
  }

  // ---------- Modal ----------
  function openModal(p) {
    modal.innerHTML =
      '<div class="modal-head">' +
        '<button class="close-btn" id="modal-close">&times;</button>' +
        '<div class="mh-name">' + esc(p.name) + "</div>" +
        '<div class="mh-team">' + p.teamName + " (" + p.team + ") &middot; #" + p.num + " &middot; " + p.pos + "</div>" +
      "</div>" +
      '<div class="modal-body">' +
        '<div class="info-row">' +
          '<div class="info-item"><div class="il">Height</div><div class="iv">' + p.height + " &middot; " + p.weight + " lb</div></div>" +
          '<div class="info-item"><div class="il">Age</div><div class="iv">' + p.age + " years</div></div>" +
          '<div class="info-item"><div class="il">Experience</div><div class="iv">' + p.exp + " year" + (p.exp === 1 ? "" : "s") + "</div></div>" +
          '<div class="info-item"><div class="il">College</div><div class="iv">' + esc(p.college) + "</div></div>" +
        "</div>" +
        '<h4>Per-Game Stats</h4>' +
        '<div class="stat-grid">' +
          '<div class="stat-box"><div class="sv">' + p.ppg.toFixed(1) + '</div><div class="sl">Points</div></div>' +
          '<div class="stat-box"><div class="sv">' + p.rpg.toFixed(1) + '</div><div class="sl">Rebounds</div></div>' +
          '<div class="stat-box"><div class="sv">' + p.apg.toFixed(1) + '</div><div class="sl">Assists</div></div>' +
          '<div class="stat-box"><div class="sv">' + p.spg.toFixed(1) + '</div><div class="sl">Steals</div></div>' +
          '<div class="stat-box"><div class="sv">' + p.bpg.toFixed(1) + '</div><div class="sl">Blocks</div></div>' +
          '<div class="stat-box"><div class="sv">' + p.top.toFixed(1) + '</div><div class="sl">Turnovers</div></div>' +
        "</div>" +
        '<h4 style="margin-top:20px;">Shooting Splits</h4>' +
        '<div class="stat-grid">' +
          '<div class="stat-box"><div class="sv">' + pct(p.fg) + '</div><div class="sl">FG %</div></div>' +
          '<div class="stat-box"><div class="sv">' + pct(p.tp) + '</div><div class="sl">3P %</div></div>' +
          '<div class="stat-box"><div class="sv">' + pct(p.ft) + '</div><div class="sl">FT %</div></div>' +
        "</div>" +
      "</div>";
    modalOverlay.classList.add("show");
    document.getElementById("modal-close").addEventListener("click", closeModal);
  }

  function closeModal() {
    modalOverlay.classList.remove("show");
  }

  modalOverlay.addEventListener("click", function (e) {
    if (e.target === modalOverlay) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });

  // ---------- Wire up controls ----------
  searchInput.addEventListener("input", render);
  teamFilter.addEventListener("change", render);
  posFilter.addEventListener("change", render);
  sortBy.addEventListener("change", render);

  // ---------- Init ----------
  populateTeamFilter();
  renderLeaders();

  // Expose render so the auth flow can trigger it on login
  window.renderNBA = function () {
    render();
    renderLeaders();
  };

  // If home is already visible (auto-login ran before this script), render now
  if (!document.getElementById("home-screen").classList.contains("hidden")) {
    render();
  }
})();
</script>
</body>
</html>
